# 云上 prod 编排
#
# 形态：镜像来自镜像仓库（CI 构建推送，服务器只拉取、不构建、不 clone 仓库）；
#       对外入口是宿主反代（宝塔），web 容器只绑 127.0.0.1:8082。
#
# ⚠️ 本文件里**没有 build:**——小机器上跑 Maven 必 OOM，构建一律在 CI 上做。
# ⚠️ 变量来自服务器上的 $SERVER_ROOT/.env，而 compose 默认只找**自己所在目录**的 .env；
#    所以调用方（scripts/server-deploy.sh）一律显式 `--env-file`。
# ⚠️ 内存参数（mem_limit / JAVA_TOOL_OPTIONS）的算法见 `docs/operations/内存策略.md`；
#    **数值以本文件为准**。
#
# ── 数据库：复用 quizzy 的 MySQL 容器（ADR 0005）──
# 同一台 2C2G 上 quizzy 已占 127.0.0.1:3306 与 127.0.0.1:8081；fit-app 若自带 MySQL
# 会①端口撞车、②再吃掉一整份 MySQL 内存。所以这里**没有 mysql 服务**：
# 后端容器（`fit-app-server`）加入 quizzy 的外部网络，直连容器名 `quizzy-mysql`，只用其中的 `fit_app` 库。
# 代价：两个应用共享一个 MySQL 实例（故障域与备份范围合并）——取舍见 ADR 0005。
#
# ⚠️ 端口为什么是 8082：8081 已被 quizzy-web 占用（`ss -tlnp | grep 8081` 可查）。
#    改端口时要同步改宝塔反代的「目标 URL」与 deploy/nginx/site.conf.example。
#
# ── 镜像仓库：ghcr.io（2026-10-12 从阿里云 ACR 换过来）──
# ACR 新个人版的域名 `crpi-*.personal.craliyuncs.com` 当天在全球 DNS 消失（NXDOMAIN），
# 服务器拉不到镜像。ghcr.io 服务器可达、CI 用内置 GITHUB_TOKEN 推送（零新增 Secrets）。
# 变量名用中性的 IMAGE_REGISTRY / IMAGE_NAMESPACE，将来再换 registry 不用改名。

name: fit-app   # 固定项目名，免得容器/网络名随 compose 目录名变化而漂移

# 统一的日志上限：Docker 默认的 json-file 不限制大小，系统盘迟早被日志吃掉。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# quizzy compose 的默认网络（`name: quizzy` → `<项目名>_default`）。
# ⚠️ external: true = 这个网络由外面创建并拥有，fit-app **不会**创建也不会销毁它；
#    代价是 quizzy 若重建（down/up）导致网络重建，fit-app 的 `fit-app-server` 要跟着重启一次。
networks:
  quizzy:
    external: true
    name: quizzy_default

services:
  fit-app-server:
    # ⚠️ 服务名必须用**专属名**（不用 server 这类通用词）：compose 会把服务名自动加为它所在
    #    **每个**网络的别名，且无法按网络移除——2026-10-12 撞名事故的根因就是通用名 `server`
    #    与 quizzy 的服务在网络里重名，Docker DNS 轮询把 quizzy 约一半 /api 劫持到这边。
    #    取舍与备选见 ADR 0006。
    # 镜像 tag 跟随版本号，但由部署时传入（这里永远是变量，不写死）。
    image: ${IMAGE_REGISTRY:?未设置 IMAGE_REGISTRY}/${IMAGE_NAMESPACE:?未设置 IMAGE_NAMESPACE}/fit-app-server:${APP_VERSION:?未设置 APP_VERSION}
    container_name: fit-app-server
    restart: unless-stopped
    # 内核级内存硬顶：JVM 的**理论上限 ≈ -Xmx + 242MB**，这里留约 1.3 倍余量。
    mem_limit: 640m
    networks:
      default:
        # ⚠️ `server` 是**兼容层别名**：web 镜像内的 nginx 用它找后端（frontend/nginx.conf 的
        #    `set $backend http://server:8080`，改它要重发镜像）。别名只在 fit-app 自己的网络里。
        aliases:
          - server
      quizzy: {}   # 进 quizzy 网络时**不带** server 别名——通用名正是事故根因
    environment:
      # ⚠️ 主机是**容器名** quizzy-mysql（走 quizzy_default 网络的 Docker 内置 DNS），
      #    不是 localhost——容器内的 localhost 是它自己。
      # ⚠️ createDatabaseIfNotExist=true：首次部署自动建 fit_app 库，省掉手工 CREATE DATABASE；
      #    连的是 root，有这个权限；库已存在时该参数无害。
      SPRING_DATASOURCE_URL: jdbc:mysql://quizzy-mysql:3306/fit_app?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      # ⚠️ 必须与 quizzy 的 /srv/quizzy/.env 里 MYSQL_ROOT_PASSWORD **同值**——是同一个实例。
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD（与 quizzy 同值）}
      # 必填：默认值已随仓库公开，缺失时 compose 在读配置阶段就退出。
      FITAPP_JWT_SECRET: ${FITAPP_JWT_SECRET:?请在 .env 里设置 FITAPP_JWT_SECRET}
      FITAPP_JWT_EXPIRE_DAYS: ${FITAPP_JWT_EXPIRE_DAYS:-7}
      FITAPP_CORS_ALLOWED_ORIGINS: ${FITAPP_CORS_ALLOWED_ORIGINS:-}
      # 营养成分表识别（ADR 0018）：DashScope Key。留空＝未配置——识别接口友好降级，
      # 手动录入与其他功能不受影响；配了才走云端识别。
      FITAPP_RECOGNITION_API_KEY: ${FITAPP_RECOGNITION_API_KEY:-}
      # 服务商端点与模型档（默认 DashScope/qwen3-vl-8b-instruct；换智谱等在 .env 覆盖）。
      FITAPP_RECOGNITION_ENDPOINT: ${FITAPP_RECOGNITION_ENDPOINT:-}
      FITAPP_RECOGNITION_MODEL: ${FITAPP_RECOGNITION_MODEL:-}
      # 思维链：disabled＝显式关闭（默认——转录免深思）；auto＝不传、按服务商默认。
      FITAPP_RECOGNITION_THINKING_MODE: ${FITAPP_RECOGNITION_THINKING_MODE:-}
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: 8080
      # 小机器硬约束：钉死堆与元空间，避免 JVM 按宿主机内存自动放大。
      # 用 JAVA_TOOL_OPTIONS 而不是覆盖 entrypoint：① 不动镜像；② 不会把
      # `java -jar /app/app.jar` 抄进 compose 变成第二份会漂的真相源。
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=112m -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:TieredStopAtLevel=1 -XX:+UseSerialGC"
      SERVER_TOMCAT_THREADS_MAX: 32
    # 不发布端口：只经 web 容器的反代暴露 /api/，接口文档因此也不对外。
    # ⚠️ 没有 depends_on：跨项目的 quizzy-mysql 不归本文件管，编排层无法表达依赖。
    #    启动顺序靠 healthcheck 的 start_period + Flyway 自己重试连库来兜底。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/fit-app-web:${APP_VERSION}
    container_name: fit-app-web
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      fit-app-server:
        condition: service_healthy
    # 只绑回环：对外入口交给宿主反代，由它反代到 127.0.0.1:8082。
    # 绑回环而不是 0.0.0.0，是为了①不与宿主上已有的服务（quizzy 的 8081）抢端口、
    # ②不直接对公网可达。⚠️ 安全组与宝塔防火墙都**不要**放行这个端口。
    ports:
      - "127.0.0.1:8082:80"
    logging: *default-logging
