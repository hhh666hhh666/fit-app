name: Release

# 推 v* tag 即发布：版本门禁 → 迁移验证 → 构建推镜像仓库 → SSH 部署。
# 这是本项目唯一会改动运行中服务的流水线。
# 与 ci.yml 的分工：ci.yml 管「提交能不能过」，本文件管「tag 能不能上线」。
#
# env 段是**真值**（与服务器 /srv/fit-app/.env 里的镜像仓库项保持一致）。
# 镜像仓库是 ghcr.io：登录用内置 GITHUB_TOKEN（零新增 Secrets），
# 服务器匿名拉公开包——2026-10-12 从阿里云 ACR 换过来（那边的域名当天从全球 DNS 消失）。
# ⚠️ secrets 不能出现在 if: 里（GitHub 会报 Unrecognized named-value 并让整个 workflow 作废，
#    故障表现是「run 失败但 jobs 数为 0」，极容易误判）——需要判「有没有」时先在 job 级 env
#    折算成普通布尔，step 再判 env。密钥值本身不进 env，只传「有没有」。
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # ghcr.io 推送镜像要 write；用内置 GITHUB_TOKEN，不需要任何自建 Secret。
  packages: write

# 同一个 tag 的发布串行，避免两次部署交叉；不取消已开始的（部署做一半被中断更糟）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 镜像仓库 = GitHub 自己的 ghcr.io。路径规则 ghcr.io/<owner>/<image>，
  # 所以「命名空间」就是仓库 owner（hhh666hhh666），不是项目名。
  # 变量名保持中性（IMAGE_*）：将来再换 registry 时只改这两个值。
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: hhh666hhh666
  # 与 quizzy 同一台轻量服务器；产物落到 /srv/fit-app（见 scripts/server-deploy.sh）。
  DEPLOY_HOST: 8.137.172.6
  DEPLOY_USER: root

jobs:
  # 1. 版本门禁：tag 与 frontend/package.json / backend/pom.xml / CHANGELOG 对齐，
  #    且 compose 用的是 ${APP_VERSION}。
  version:
    name: 版本 · tag 与两处对齐
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 默认是 fetch-depth: 1 的浅克隆，拿不到 tag；而这个 job 的前提就是 tag
          fetch-depth: 0

      - name: 跑 scripts/check-version.sh
        run: bash scripts/check-version.sh "$GITHUB_REF_NAME"

      # 镜像 tag 不带 v（git tag 带）。compose 不支持 ${VAR#v} 截断，剥前缀只能发生在传参之前。
      - id: meta
        name: 算出镜像 tag（去掉 v 前缀）
        run: echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # 2. 在一次性 mysql:8 上把 db/migration 完整跑一遍。
  #    `mvn test` 完全不碰数据库，迁移若不单独验就从未被任何流程验证过。
  #    ⚠️ 它只证明「语法能跑」，不证明「数据安全」——破坏性迁移仍靠人守。
  flyway-verify:
    name: 迁移 · 临时库重放
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: version
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fit_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - name: 按顺序重放迁移脚本
        run: |
          set -euo pipefail
          prev=0
          # ⚠️ glob 是**字典序**：两位数版本号会排错（V10 排在 V1 之前，'_' vs '0' 的字符序）——
          #    必须 sort -V 按数值版本排。V10 首次出现时暴露（2026-10-12 v0.3.0 Release 卡在「迁移重放」）。
          for f in $(printf '%s\n' backend/src/main/resources/db/migration/V*.sql | sort -V); do
            base="$(basename "$f")"
            # 文件名要合 Flyway 约定，否则应用启动时会静默忽略它
            if ! printf '%s' "$base" | grep -qE '^V[0-9]+__[^/]+\.sql$'; then
              echo "::error::迁移文件名不合 Flyway 约定：$base"; exit 1
            fi
            n="$(printf '%s' "$base" | sed -E 's/^V([0-9]+)__.*/\1/')"
            if [ "$n" -le "$prev" ]; then
              echo "::error::迁移版本号不是严格递增：$base（上一个 $prev）"; exit 1
            fi
            prev="$n"
            echo "==> 应用 $base"
            # ⚠️ mysql 客户端默认连接字符集可能是 latin1（实测本机 docker 容器就是）：中文会被
            #    按单字节解释、一个汉字变 3 个字符 → VARCHAR 长度凭空 ×3，于是 V13 里较长的
            #    食物名会在严格模式下报 1406（Data too long for column 'name'）。
            #    必须显式指定 utf8mb4。
            #    （本机与线上走 Flyway + JDBC，字符集由连接 URL 指定，所以这条路径从未暴露问题；
            #     它是「CLI 重放」这条验证路径独有的坑——v0.4.0 首次把 V11~V13 带进这里才撞上。）
            docker run --rm --network host -i mysql:8 \
              mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot fit_app < "$f"
          done
          echo "==> 全部迁移在 MySQL 8 上重放成功"

  # 3. 构建两个镜像推仓库。tag = 去 v 的版本号；**不推 latest**——浮动 tag 会让
  #    「线上跑的是哪个版本」说不清，回滚落点就是版本 tag。
  build-push:
    name: 镜像 · 构建并推送
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [version, flyway-verify]
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      # 基础镜像走 Docker Hub：匿名额度按共享出口 IP 计、很容易撞顶；配了账号则按账号计。
      - name: 登录 Docker Hub（未配 secrets 时跳过）
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # ghcr.io 的登录：用户名用 GITHUB_ACTOR（仓库 owner），密码用内置 GITHUB_TOKEN。
      # 事先要在本 workflow 顶层声明 `permissions: packages: write`，否则推包会 403。
      - name: 登录镜像仓库（ghcr.io）
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: 构建信息
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      # CI 在境外 runner 上：Maven 与 npm 都切回官方源，比走国内镜像更快也更稳。
      - name: 构建并推后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # ⚠️ 关掉 buildx 默认附带的 attestation：产物会变成 manifest list，
          #    部分个人版镜像仓库对它的兼容性没有验证过，别赌这个。
          provenance: false
          sbom: false
          build-args: |
            MAVEN_MIRROR=central
            APP_VERSION=${{ needs.version.outputs.image_tag }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fit-app-server:${{ needs.version.outputs.image_tag }}

      - name: 构建并推前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          sbom: false
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            APP_VERSION=${{ needs.version.outputs.image_tag }}
            APP_COMMIT=${{ steps.meta.outputs.commit }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fit-app-web:${{ needs.version.outputs.image_tag }}

      # ghcr 的包默认私有，而服务器是**匿名**拉取 → 必须设成 public，否则 deploy 会 401。
      # ⚠️ GITHUB_TOKEN 改包可见性在部分账号设置下会被拒（403）；用 continue-on-error
      #    兜着，真被拒时到 https://github.com/users/hhh666hhh666/packages/container/<包名>/settings 手点。
      - name: 把两个包设为 public（失败不阻塞本 job）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for pkg in fit-app-server fit-app-web; do
            if gh api --method PATCH "/user/packages/container/$pkg" -f visibility=public >/dev/null 2>&1; then
              echo "==> $pkg 已设为 public"
            else
              echo "::warning::$pkg 设 public 失败（去包设置页手动改）"
            fi
          done

  # 4. 把 compose 与脚本送上去，再执行部署脚本（拉取 → 重启 → 等健康）。
  #    服务器上**不 clone 仓库**：每次送过去，保证「服务器上的编排 = 这个 tag 的编排」。
  deploy:
    name: 部署 · SSH 到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, build-push]
    env:
      HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: 准备 SSH 凭据
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ "${{ env.HAS_KNOWN_HOSTS }}" = "true" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "⚠️ 未配 DEPLOY_SSH_KNOWN_HOSTS，改用 ssh-keyscan 现场采集" >&2
            ssh-keyscan -H "${{ env.DEPLOY_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: 送 compose 与脚本
        run: |
          set -euo pipefail
          ssh "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" 'mkdir -p /srv/fit-app/compose/scripts'
          scp docker-compose.prod.yml \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/srv/fit-app/compose/docker-compose.prod.yml"
          # 备份与恢复脚本随发版一起送（ADR 0026）：server-deploy.sh 在 up -d 之前会检查
          # ./backup-mysql.sh 是否**可执行**，所以下面必须补 chmod——scp 不保留执行位。
          scp scripts/server-deploy.sh scripts/server-rollback.sh scripts/server-compose.sh \
            scripts/backup-mysql.sh scripts/backup-system-mysql.sh scripts/backup-uploads.sh \
            scripts/backup-to-oss.sh scripts/restore-verify.sh scripts/server-install-cron.sh \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/srv/fit-app/compose/scripts/"
          ssh "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            'chmod +x /srv/fit-app/compose/scripts/*.sh'

      - name: 执行部署
        run: |
          ssh "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "bash /srv/fit-app/compose/scripts/server-deploy.sh '${{ needs.version.outputs.image_tag }}'"

      # 部署脚本在 up -d 之前已经强制备份过一次；这里顺手把那份**验一遍**——
      # 「dump 导出成功」不等于「能恢复」，只有真灌进临时库跑通才算数（ADR 0026）。
      #
      # ⚠️ continue-on-error：这一步是**体检**，不是发布的成败判据——走到这里部署已经完成了，
      #    把它算作发布失败会误导（2026-10-16 第一次上线就踩到：演练把共用实例的 mysqld 灌 OOM，
      #    于是整个 run 标红，而部署其实完全成功）。脚本里另有体积闸，过大的 dump 会跳过演练。
      - name: 验证备份可恢复
        continue-on-error: true
        run: |
          ssh "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "bash /srv/fit-app/compose/scripts/restore-verify.sh"

      - name: 清理私钥
        if: always()
        run: rm -f ~/.ssh/id_ed25519
