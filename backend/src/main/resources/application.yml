server:
  # 本机 dev 端口 8083：避开 8080（quizzy 的 dev 后端常驻）与 8081/8082（容器 web）。
  # ⚠️ 只影响本机裸跑（mvn spring-boot:run / java -jar）；容器内由 compose 注入 SERVER_PORT=8080，
  #    与 nginx 反代、healthcheck、部署脚本是一套，不要跟着改。
  port: ${SERVER_PORT:8083}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fit-app-server

  datasource:
    # 默认值供本机开发用（mvn spring-boot:run 直连本机映射出来的端口）；
    # 容器里由 compose 注入 SPRING_DATASOURCE_* 覆盖，指向 mysql 服务。
    # ⚠️ 端口是 3307 而非 3306：本机 3306 已被另一个项目的 MySQL 容器占用（见 docs/operations/configuration.md）。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/fit_app?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    # ⚠️ date-format 管不到 LocalDateTime：那种字段前端要自己 `replace('T',' ').slice(0,16)`。

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # ⚠️ 全局 not_null：`updateById` 会**静默跳过 null 字段**。
      #    要「把某个字段清空」必须用 LambdaUpdateWrapper 的 set()，别指望传 null。
      update-strategy: not_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.example.fitapp: debug
    org.springframework.web: info

fitapp:
  version: ${FITAPP_VERSION:dev}
  # 同源部署（前端与 /api 同域）不需要 CORS，所以默认留空 = 完全不注册；
  # 只有出现跨域消费者时才填，逗号分隔。见 WebConfig 的注释。
  cors:
    allowed-origins: ${FITAPP_CORS_ALLOWED_ORIGINS:}
  jwt:
    # ⚠️ 下面这串是兜底默认值，已随仓库公开；JwtUtil 检测到它会拒绝使用，
    #    改为启动时随机生成（重启需重新登录），所以本机裸跑只是不便，不会有安全问题。
    #    正式环境必须在 .env 里设置 FITAPP_JWT_SECRET。
    secret: ${FITAPP_JWT_SECRET:fitapp-default-jwt-secret-please-replace-in-production-0123456789abcdef}
    expire-days: ${FITAPP_JWT_EXPIRE_DAYS:7}
