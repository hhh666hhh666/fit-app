server:
  # 本机 dev 端口 8083：避开 8080（quizzy 的 dev 后端常驻）与 8081/8082（容器 web）。
  # ⚠️ 只影响本机裸跑（mvn spring-boot:run / java -jar）；容器内由 compose 注入 SERVER_PORT=8080，
  #    与 nginx 反代、healthcheck、部署脚本是一套，不要跟着改。
  port: ${SERVER_PORT:8083}
  # 认反代传来的 X-Forwarded-Proto/For：线上 TLS 在宿主 nginx 终止，后端自己只看得到 http。
  # 不认的话一旦开了 CORS 白名单（apk 需要），浏览器同源的 https 请求会被判成跨域 → 403 Invalid CORS request。
  # native = Tomcat RemoteIpValve，只信任内网段（Docker 网络在内）来的转发头。
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fit-app-server

  datasource:
    # 默认值供本机开发用（mvn spring-boot:run 直连本机映射出来的端口）；
    # 容器里由 compose 注入 SPRING_DATASOURCE_* 覆盖，指向 mysql 服务。
    # ⚠️ 端口是 3307 而非 3306：本机 3306 已被另一个项目的 MySQL 容器占用（见 docs/operations/configuration.md）。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/fit_app?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    # ⚠️ date-format 管不到 LocalDateTime：那种字段前端要自己 `replace('T',' ').slice(0,16)`。

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # ⚠️ 全局 not_null：`updateById` 会**静默跳过 null 字段**。
      #    要「把某个字段清空」必须用 LambdaUpdateWrapper 的 set()，别指望传 null。
      update-strategy: not_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.example.fitapp: debug
    org.springframework.web: info

fitapp:
  version: ${FITAPP_VERSION:dev}
  # 同源部署（前端与 /api 同域）不需要 CORS，所以默认留空 = 完全不注册；
  # 只有出现跨域消费者时才填，逗号分隔。见 WebConfig 的注释。
  cors:
    allowed-origins: ${FITAPP_CORS_ALLOWED_ORIGINS:}
  jwt:
    # ⚠️ 下面这串是兜底默认值，已随仓库公开；JwtUtil 检测到它会拒绝使用，
    #    改为启动时随机生成（重启需重新登录），所以本机裸跑只是不便，不会有安全问题。
    #    正式环境必须在 .env 里设置 FITAPP_JWT_SECRET。
    secret: ${FITAPP_JWT_SECRET:fitapp-default-jwt-secret-please-replace-in-production-0123456789abcdef}
    expire-days: ${FITAPP_JWT_EXPIRE_DAYS:7}
  storage:
    # 餐照总占用上限（字节，原图＋缩略图）。达到即拒绝上传（ADR 0013），改这里就能调。
    # 默认 20 GB：按默认压缩档一天满拍 4 张约够 45 年；若长期用「无损」档约三年半触顶。
    photo-quota-bytes: ${FITAPP_PHOTO_QUOTA_BYTES:21474836480}
    # 餐照文件目录（ADR 0026）：图片实体落在磁盘上，库里只留相对路径。
    # ⚠️ 容器里这个路径必须是**挂载的宿主机目录**（compose 绑 /srv/fit-app/uploads）——
    #    否则容器重建时图片随可写层一起消失，而库里已经没有底片可恢复。
    #    MealPhotoFileMigrator 启动时会自检是否为挂载点，没挂就中止搬迁（见其类注释）。
    photo-dir: ${FITAPP_PHOTO_DIR:/data/uploads}
    # 启动时自动把库里遗留的餐照 BLOB 搬到 photo-dir（幂等，搬完即清空库中底片）。
    # 只有在想手工控制搬迁时机时才设 false。
    migrate-on-start: ${FITAPP_PHOTO_MIGRATE_ON_START:true}
  recognition:
    # 营养成分表照片识别（ADR 0018）：DashScope（百炼）OpenAI 兼容端点，服务器在阿里云、同云直连。
    # api-key 为空 = 未配置：识别接口返回友好降级提示（不记账、不影响其他功能）。
    # 生产环境经 FITAPP_RECOGNITION_API_KEY 注入（值只存在于服务器 .env，不入库）。
    endpoint: ${FITAPP_RECOGNITION_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${FITAPP_RECOGNITION_MODEL:qwen3-vl-8b-instruct}
    api-key: ${FITAPP_RECOGNITION_API_KEY:}
    # 思维链：disabled=显式关闭（默认——转录是照抄活，深思只加延迟、烧输出 token，
    # 还可能诱发 GLM-4.6V 的 overthinking）；enabled=显式开；auto=不传参数、按服务商默认
    # （智谱默认 enabled=自动思考，DashScope 的 instruct 档默认不思考）。
    thinking-mode: ${FITAPP_RECOGNITION_THINKING_MODE:disabled}
