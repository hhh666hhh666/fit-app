server {
    # 宿主 nginx（宝塔）用 127.0.0.1 反代进来，Host 是域名；这里不挑 Host，一律接住。
    listen 80;
    server_name _;

    # 重定向一律发**相对** Location：容器内的 scheme/端口认知是 http/80，
    # 拼绝对 URL 会在宿主 TLS 反代后错成 http 跳转。
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限（10MB，见 backend/src/main/resources/application.yml）对齐。
    client_max_body_size 12m;

    # index.html 绝不缓存：它引用的是带内容 hash 的产物，缓存住就会「新版上不去、要硬刷新」。
    # ⚠️ 只写 no-cache，**不要**再叠 no-store：no-store 会让浏览器连 ETag 都不存，
    # 于是每次冷启动都全量重拉（实测白屏的第一段就是这么来的），
    # 而 no-cache 已经保证「每次向服务器确认」——有 ETag 就不会用到旧版，语义一样安全。
    # 也别用 add_header 叠加：宿主 nginx 可能已经发过一个 Cache-Control，两个头并存时
    # 浏览器取更严格的那个，排查起来极难。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # apk 壳的更新清单：同样不能缓存，否则手机端永远探测到旧版本号。
    location = /web/version.json {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # uni-app H5 产物同样带内容 hash（assets/xxx-<hash>.js|css），可以长期强缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 路由是 **hash 模式**（见 src/manifest.json 的 h5.router.mode）：
    # 页面路径形如 /#/pages/home/index，请求永远落在 /，不需要 SPA 回退。
    # 这行 try_files 只是覆盖「有人手敲了非 hash 路径」的边缘情况。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 用变量 + resolver 而不是直接写死 upstream：容器启动时 server 未必已就绪，
        # 写死会让 nginx 在解析失败时直接拒绝启动；127.0.0.11 是 Docker 内置 DNS。
        resolver 127.0.0.11 valid=30s;
        set $backend http://server:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        # 宿主 nginx 已终止 TLS 并注入下面这些头，这里**透传**而不是用容器内的 $scheme：
        # 容器内 $scheme 永远是 http，用它会把 https 语义丢掉。
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Authorization 默认就会被透传，这里显式写出是为了防止将来误删
        proxy_set_header Authorization $http_authorization;
    }
}
