plugins {
    id 'com.android.application'
}

// 签名配置从 local.properties 读（Android 惯例文件，不入库；见 .gitignore）。
// 密码的真相源只在构建机本地，不写进仓库、不进对话。
def secrets = new Properties()
def secretsFile = rootProject.file('local.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}

android {
    namespace 'com.fitapp.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.fitapp.app"
        minSdk 26
        targetSdk 34
        // 与线上版本对齐：git tag v0.1.4 → versionName 0.1.4；
        // versionCode 是单调递增的整数（同一 keystore 下覆盖安装才认它），
        // 每次发版都要 +1——这里 6 对应 v0.1.5（5 是 v0.1.4，4 是 v0.1.3）。
        // v0.1.4 的内容：新产物下好后弹窗提示重启，带「立即重启 / 稍后」。
        // v0.1.5 的内容：返回键先问 H5 关弹层（window.__ftBack），关掉了就不后退。
        versionCode 6
        versionName "0.1.5"
    }

    signingConfigs {
        release {
            storeFile secrets['fitapp.storeFile'] ? file(secrets['fitapp.storeFile']) : null
            storePassword secrets['fitapp.storePassword']
            keyAlias secrets['fitapp.keyAlias']
            keyPassword secrets['fitapp.keyPassword']
        }
    }

    buildTypes {
        release {
            // 壳应用不做混淆（全部代码就是这个 WebView Activity）
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 仅为了 FileProvider（拍照输出 URI 的授权）——壳自身不引其它 androidx 组件
    implementation 'androidx.core:core:1.13.1'
    // WebViewAssetLoader：把本地产物映射成虚拟 https 域（见 LocalWeb 的类注释）。
    // 不用它就得走 file://，那会同时丢同源策略、绝对路径与 Secure Context。
    implementation 'androidx.webkit:webkit:1.11.0'
}
