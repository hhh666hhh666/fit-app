# 本机开发只起数据库；后端与前端在宿主机上直跑（`mvn spring-boot:run` / `npm run dev`）。
# 理由：改代码不用重建镜像，断点与热更新都还在。
services:
  mysql:
    image: mysql:8
    container_name: fit-app-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: fit_app
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    volumes:
      # 命名卷而不是绑定挂载宿主机目录：数据留在 Docker 自己的 Linux 文件系统里，
      # 表名大小写规则与线上一致（Windows 盘不区分大小写，会被设成 lower_case_table_names=2），
      # 也免去经 WSL 跨文件系统读写的慢（首次初始化曾慢到 healthcheck 先判 unhealthy）。
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
    # 显式命名：不随仓库目录名（worktree 等）变成另一个卷
    name: fit-app-mysql-data
